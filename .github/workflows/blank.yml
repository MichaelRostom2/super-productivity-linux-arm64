name: Build Linux Arm64 Packages

on: workflow_dispatch
  # Triggers the workflow on push request events but only for the "main" branch
  #push:
  #  branches: [ "main" ]


jobs:
  build:
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v6
        with:
          repository: super-productivity/super-productivity

      - name: Install npm Packages
        run: npm i

      - run: npm run env # Generate env.generated.ts

      - name: Build Frontend (No tests)
        run: npm run buildAllElectron:noTests:prod

      - name: Build Electron RPM
        run: npx electron-builder --linux rpm --arm64 --publish never
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create Github Release
        uses: ncipollo/release-action@v1 
        with:
          repo: MichaelRostom2/super-productivity-linux-arm64
          artifacts: ./.tmp/app-builds/*.rpm
          tag: release
          token: ${{ secrets.PERSONAL_GITHUB_TOKEN }} 
          allowUpdates: true
