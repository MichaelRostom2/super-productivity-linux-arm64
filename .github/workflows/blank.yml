name: Build Linux Arm64 Packages

on: workflow_dispatch
  # Triggers the workflow on push request events but only for the "main" branch
  #push:
  #  branches: [ "main" ]


jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6
        with:
          repository: super-productivity/super-productivity

      - name: Install npm Packages
        run: npm i

      - run: npm run env # Generate env.generated.ts

      - name: Build Frontend (No tests)
        run: npm run buildAllElectron:noTests:prod

      - name: Build Electron RPM
        run: npx electron-builder --linux rpm --arm64
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create Github Release
        uses: elgohr/Github-Release-Action@v5
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          title: MyRelease

      - name: Upload Release Asset
        uses: softprops/action-gh-release@v2
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: ./tmp/app-builds/superProductivity-aarch64.rpm

      - name: Publish Release
        uses: StuYarrow/publish-release@v1.1.2
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          id: ${{ steps.create_release.outputs.id }}
